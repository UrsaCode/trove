<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trove — library</title>
    <!--
      Screenshot harness. Links the real stylesheets so the pictures on the
      site are the actual interface, not a mockup of it. Content is seeded
      because the real page needs chrome APIs and a populated database.
    -->
    <link rel="stylesheet" href="/src/styles/tokens.css?v=2" />
    <link rel="stylesheet" href="/src/styles/library.css?v=2" />
    <style>
      html,
      body {
        width: 1512px;
        height: 860px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="library">
      <aside class="rail">
        <div class="rail-head">
          <svg class="mark" viewBox="0 0 32 32" width="18" height="18" fill="none" aria-hidden="true">
            <path
              d="M6 13v6.5A6.5 6.5 0 0 0 12.5 26h7A6.5 6.5 0 0 0 26 19.5V13"
              stroke="currentColor"
              stroke-width="2.8"
              stroke-linecap="round"
            />
            <rect x="12.5" y="4" width="7" height="7" rx="1.6" fill="var(--tether)" />
          </svg>
          <span class="wordmark">Trove</span>
        </div>

        <button class="rail-item rail-all">
          <div>
            <div class="rail-title">All files</div>
            <div class="rail-sub mono">34 files · 6 conversations</div>
          </div>
        </button>

        <div class="rail-eyebrow eyebrow">Conversations</div>
        <div class="rail-list" id="rail"></div>

        <button class="rail-settings">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" />
            <path d="M8 1.6v1.7M8 12.7v1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M1.6 8h1.7M12.7 8h1.7M3.5 12.5l1.2-1.2M11.3 4.7l1.2-1.2" />
          </svg>
          <span>Settings</span>
        </button>

        <footer class="rail-foot">
          <div class="mono rail-kept">4.2 MB kept locally</div>
          <div class="meter"><span style="width: 34%"></span></div>
          <div class="mono rail-local">Nothing leaves this browser</div>
        </footer>
      </aside>

      <main class="content">
        <div class="toolbar">
          <div class="search">
            <span class="search-icon" aria-hidden="true"></span>
            <input class="mono" placeholder="filename, extension, or conversation" />
          </div>
          <div class="filters">
            <button class="chip" aria-selected="true">All</button>
            <button class="chip" aria-selected="false">Pages</button>
            <button class="chip" aria-selected="false">Images</button>
            <button class="chip" aria-selected="false">Code</button>
            <button class="chip" aria-selected="false">Data</button>
          </div>
        </div>

        <div class="split" data-detail="on">
          <div class="table">
            <div class="thead">
              <div class="col-file eyebrow">File</div>
              <div class="col-size eyebrow">Size</div>
              <div class="col-when eyebrow">Captured</div>
              <div class="col-src eyebrow">Source</div>
            </div>
            <div class="tbody" id="rows"></div>
          </div>

          <aside class="detail">
            <header class="detail-head">
              <div class="detail-ident">
                <div class="detail-name mono">fleet-console.html</div>
                <div class="tether">
                  <span class="node"></span><span class="wire"></span
                  ><span class="lbl">tethered to Fleet dashboard</span>
                </div>
              </div>
              <button class="btn">Full screen</button>
              <button class="btn">Open</button>
            </header>
            <div class="detail-stage">
              <iframe class="detail-paper" id="paper" title="preview"></iframe>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <script src="seed.js"></script>
    <script>
      renderRail([
        { title: 'Fleet dashboard heartbeat', files: 9, when: '12 min', moved: false, on: true },
        { title: 'Prospekt store screenshots', files: 4, when: '2h', moved: true },
        { title: 'Phuket catalogue search bar', files: 3, when: 'yesterday', moved: false },
        { title: 'ReDoS analyzer slice 2', files: 6, when: '3d', moved: true },
        { title: 'CS619 sequence diagrams', files: 8, when: '1w', moved: false },
        { title: 'Hallbook settings screens', files: 4, when: '2w', moved: false },
      ])

      renderRows([
        { name: 'fleet-console.html', conv: 'Fleet dashboard heartbeat', size: '30.6 KB', when: 'just now', state: 'tethered', selected: true },
        { name: 'fleet-thresholds.html', conv: 'Fleet dashboard heartbeat', size: '14.6 KB', when: '4 min ago', state: 'moved', msg: 'newer in msg 19' },
        { name: 'tile-1280x800.png', conv: 'Prospekt store screenshots', size: '412 KB', when: '14 min ago', state: 'tethered' },
        { name: 'extraction-mark.svg', conv: 'Prospekt store screenshots', size: '2.4 KB', when: '18 min ago', state: 'edited' },
        { name: 'redos_core.py', conv: 'ReDoS analyzer slice 2', size: '31.9 KB', when: 'yesterday', state: 'tethered' },
        { name: 'search-bar.tsx', conv: 'Phuket catalogue search bar', size: '18.4 KB', when: '2h ago', state: 'moved', msg: 'newer in msg 42' },
        { name: 'wizard-copy.json', conv: 'Phuket catalogue search bar', size: '1.2 KB', when: '2h ago', state: 'tethered' },
        { name: 'entities.csv', conv: 'CS619 sequence diagrams', size: '88 KB', when: '3 days ago', state: 'tethered' },
        { name: 'test-cases-17.md', conv: 'CS619 sequence diagrams', size: '24.6 KB', when: '3 days ago', state: 'tethered' },
      ])

      renderPreview(document.getElementById('paper'))
    </script>
  </body>
</html>
