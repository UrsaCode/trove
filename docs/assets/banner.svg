<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Trove — the files Claude writes in a conversation, kept in a library you own, each still tethered to its source">
  <title>Trove</title>
  <desc>The wordmark beside a small library of kept files. Each file draws a tether — a dot, a line, a label — back to the conversation it came from: aqua where the copy still agrees with its source, amber where the source has moved on.</desc>

  <rect width="1200" height="280" fill="#0e1014"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow" cx="70%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#5fd3bc" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#5fd3bc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark: an open tray catching a file -->
  <g transform="translate(72 64)">
    <path d="M0 20v11.4A11.4 11.4 0 0 0 11.4 43h12.2A11.4 11.4 0 0 0 35 31.4V20"
          fill="none" stroke="#e9e7e2" stroke-width="4.4" stroke-linecap="round"/>
    <rect x="12.2" y="1" width="12.2" height="12.2" rx="2.8" fill="#5fd3bc"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(128 92)">
    <text x="0" y="0" font-family="'Archivo', 'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="700" fill="#e9e7e2" letter-spacing="-1.5">Trove</text>
    <text x="2" y="36" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" fill="#5fd3bc" letter-spacing="3">FILES CLAUDE WROTE, KEPT</text>
  </g>
  <g transform="translate(72 210)">
    <text x="0" y="0" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#8a9299">A local library for the files a conversation gives you —</text>
    <text x="0" y="26" font-family="'Segoe UI', system-ui, sans-serif" font-size="19" fill="#8a9299">each one still tethered to where it came from.</text>
  </g>

  <!-- A kept library: file rows, each with a tether -->
  <g transform="translate(700 50)" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13">
    <rect x="0" y="0" width="428" height="180" rx="12" fill="#171a20" stroke="#2a303a" stroke-width="1.5"/>

    <!-- row 1: tethered (aqua) -->
    <g transform="translate(22 34)">
      <rect x="0" y="-13" width="22" height="18" rx="3" fill="#262b34"/>
      <text x="32" y="1" fill="#c9cdd3">fleet-console.html</text>
      <circle cx="250" cy="-4" r="3.4" fill="#5fd3bc"/>
      <line x1="258" y1="-4" x2="330" y2="-4" stroke="#5fd3bc" stroke-width="1.4"/>
      <text x="340" y="0" fill="#5fd3bc">tethered</text>
    </g>
    <!-- row 2: moved on (amber) -->
    <g transform="translate(22 78)">
      <rect x="0" y="-13" width="22" height="18" rx="3" fill="#262b34"/>
      <text x="32" y="1" fill="#c9cdd3">thresholds.html</text>
      <circle cx="250" cy="-4" r="3.4" fill="#e5a93c"/>
      <line x1="258" y1="-4" x2="322" y2="-4" stroke="#e5a93c" stroke-width="1.4" stroke-dasharray="3 3"/>
      <text x="332" y="0" fill="#e5a93c">re-pull</text>
    </g>
    <!-- row 3: tethered (aqua) -->
    <g transform="translate(22 122)">
      <rect x="0" y="-13" width="22" height="18" rx="3" fill="#262b34"/>
      <text x="32" y="1" fill="#c9cdd3">hosts.csv</text>
      <circle cx="250" cy="-4" r="3.4" fill="#5fd3bc"/>
      <line x1="258" y1="-4" x2="330" y2="-4" stroke="#5fd3bc" stroke-width="1.4"/>
      <text x="340" y="0" fill="#5fd3bc">tethered</text>
    </g>

    <line x1="22" y1="152" x2="406" y2="152" stroke="#2a303a" stroke-width="1"/>
    <text x="22" y="170" fill="#585f6b" font-size="11">Nothing leaves this browser</text>
  </g>
</svg>
