<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f5f0;
      }
      /*
       * #root must carry the full height. Without it, the nested iframe's
       * `height: 100%` resolves against an auto-height parent and falls back
       * to the iframe default of 150px - which is exactly the symptom of a
       * preview that renders correctly but only occupies a thin band.
       */
      #root {
        height: 100%;
      }
      #frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      #image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        margin: auto;
        /* Checkerboard, so transparency in a PNG reads as transparency. */
        background-image: linear-gradient(45deg, #e6e2da 25%, transparent 25%),
          linear-gradient(-45deg, #e6e2da 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e6e2da 75%),
          linear-gradient(-45deg, transparent 75%, #e6e2da 75%);
        background-size: 18px 18px;
        background-position: 0 0, 0 9px, 9px -9px, -9px 0;
      }
      #message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        color: #7c8492;
        font: 400 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
        background: #f7f5f0;
      }
      .stage {
        display: flex;
        height: 100%;
        background: #f7f5f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="sandbox.js"></script>
  </body>
</html>
