<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trove</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/library.css" />
  </head>
  <body>
    <div class="library">
      <!-- Rail. Conversations, because that is how you remember a file. -->
      <aside class="rail">
        <div class="rail-head">
          <span class="mark" aria-hidden="true"></span>
          <span class="wordmark">Trove</span>
        </div>

        <button class="rail-item rail-all" id="all-files" aria-selected="true">
          <div class="rail-title">All files</div>
          <div class="rail-sub mono" id="all-sub"></div>
        </button>

        <div class="rail-eyebrow eyebrow">Conversations</div>
        <div class="rail-list" id="conversations"></div>

        <footer class="rail-foot">
          <div class="mono rail-kept" id="kept"></div>
          <div class="meter"><span id="meter-fill"></span></div>
          <div class="mono rail-local">Nothing leaves this browser</div>
        </footer>
      </aside>

      <!-- Files -->
      <main class="content">
        <div class="toolbar">
          <div class="search">
            <span class="search-icon" aria-hidden="true"></span>
            <input
              id="search"
              type="search"
              class="mono"
              placeholder="filename, extension, or conversation"
              aria-label="Search files"
            />
          </div>
          <div class="filters" id="filters" role="tablist">
            <button class="chip" data-kind="all" aria-selected="true">All</button>
            <button class="chip" data-kind="pages" aria-selected="false">Pages</button>
            <button class="chip" data-kind="images" aria-selected="false">Images</button>
            <button class="chip" data-kind="code" aria-selected="false">Code</button>
            <button class="chip" data-kind="data" aria-selected="false">Data</button>
          </div>
        </div>

        <div class="table" id="table">
          <div class="thead">
            <div class="col-file eyebrow">File</div>
            <div class="col-size eyebrow">Size</div>
            <div class="col-when eyebrow">Captured</div>
            <div class="col-src eyebrow">Source</div>
          </div>
          <div class="tbody" id="rows"></div>
        </div>
      </main>
    </div>

    <script src="options.js"></script>
  </body>
</html>
