<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude File Vault</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="wordmark">Claude File <span>Vault</span></div>
        <div class="topbar-meta" id="totals"></div>
      </header>

      <div class="panes">
        <!-- Conversations -->
        <section class="pane" aria-label="Conversations">
          <div class="pane-head"><span class="eyebrow">Conversations</span></div>
          <div class="pane-body" id="conversations" role="listbox" tabindex="0"></div>
        </section>

        <!-- Files -->
        <section class="pane" aria-label="Files">
          <div class="pane-head">
            <span class="eyebrow" id="files-eyebrow">Files</span>
            <div class="actions">
              <button class="btn" id="update-all" title="Re-pull changed files from claude.ai">
                Update all
              </button>
              <button class="btn" id="export-all" title="Download this conversation as a zip">
                Export
              </button>
              <button class="btn btn-danger" id="delete-conv" title="Remove this conversation">
                Delete
              </button>
            </div>
          </div>
          <div class="pane-body" id="files" role="listbox" tabindex="0"></div>
        </section>

        <!-- Detail -->
        <section class="pane" aria-label="File detail">
          <div class="pane-head">
            <div class="tabs" role="tablist">
              <button class="tab" id="tab-preview" role="tab" aria-selected="true">Preview</button>
              <button class="tab" id="tab-code" role="tab" aria-selected="false">Code</button>
            </div>
            <div class="actions">
              <button class="btn btn-primary hidden" id="save-edit">Save</button>
              <button class="btn" id="update-file">Update</button>
              <button class="btn" id="export-file">Export</button>
              <button class="btn btn-danger" id="delete-file">Delete</button>
            </div>
          </div>
          <div id="conflict" class="warn hidden"></div>
          <div class="detail-body">
            <iframe
              id="preview"
              title="File preview"
              src="sandbox.html"
              sandbox="allow-scripts allow-forms allow-modals allow-popups"
            ></iframe>
            <div id="editor" class="hidden"></div>
          </div>
        </section>
      </div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
