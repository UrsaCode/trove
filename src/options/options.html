<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trove</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/library.css" />
  </head>
  <body>
    <div class="library">
      <!-- Rail. Conversations, because that is how you remember a file. -->
      <aside class="rail">
        <div class="rail-head">
          <svg class="mark" viewBox="0 0 32 32" width="18" height="18" fill="none" aria-hidden="true">
            <path
              d="M6 13v6.5A6.5 6.5 0 0 0 12.5 26h7A6.5 6.5 0 0 0 26 19.5V13"
              stroke="currentColor"
              stroke-width="2.8"
              stroke-linecap="round"
            />
            <rect x="12.5" y="4" width="7" height="7" rx="1.6" fill="var(--tether)" />
          </svg>
          <span class="wordmark">Trove</span>
        </div>

        <button class="rail-item rail-all" id="all-files" aria-selected="true">
          <div class="rail-title">All files</div>
          <div class="rail-sub mono" id="all-sub"></div>
        </button>

        <div class="rail-eyebrow eyebrow">Conversations</div>
        <div class="rail-list" id="conversations"></div>

        <button class="rail-settings" id="settings-button" aria-pressed="false">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" />
            <path d="M8 1.6v1.7M8 12.7v1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M1.6 8h1.7M12.7 8h1.7M3.5 12.5l1.2-1.2M11.3 4.7l1.2-1.2" />
          </svg>
          <span>Settings</span>
        </button>

        <footer class="rail-foot">
          <div class="mono rail-kept" id="kept"></div>
          <div class="meter"><span id="meter-fill"></span></div>
          <div class="mono rail-local">Nothing leaves this browser</div>
        </footer>
      </aside>

      <!-- Files -->
      <main class="content">
        <div class="toolbar">
          <div class="search">
            <span class="search-icon" aria-hidden="true"></span>
            <input
              id="search"
              type="search"
              class="mono"
              placeholder="filename, extension, or conversation"
              aria-label="Search files"
            />
          </div>
          <div class="filters" id="filters" role="tablist">
            <button class="chip" data-kind="all" aria-selected="true">All</button>
            <button class="chip" data-kind="pages" aria-selected="false">Pages</button>
            <button class="chip" data-kind="images" aria-selected="false">Images</button>
            <button class="chip" data-kind="code" aria-selected="false">Code</button>
            <button class="chip" data-kind="data" aria-selected="false">Data</button>
          </div>
        </div>

        <!-- Starts with no stage: nothing is selected, so there is nothing to frame. -->
        <div class="split" id="split" data-detail="off">
          <div class="table" id="table">
            <div class="thead">
              <div class="col-file eyebrow">File</div>
              <div class="col-size eyebrow">Size</div>
              <div class="col-when eyebrow">Captured</div>
              <div class="col-src eyebrow">Source</div>
            </div>
            <div class="tbody" id="rows"></div>
          </div>

          <!-- Preview. Controls sit in the band above; nothing overlays the file. -->
          <aside class="detail" id="detail">
            <header class="detail-head">
              <div class="detail-ident">
                <div class="detail-name mono" id="detail-name"></div>
                <div class="tether" id="detail-tether">
                  <span class="node"></span><span class="wire"></span><span class="lbl"></span>
                </div>
              </div>
              <button class="btn" id="full-screen" disabled>Full screen</button>
              <button class="btn" id="open-reader" disabled>Open</button>
            </header>
            <div class="detail-stage">
              <iframe
                id="preview"
                class="detail-paper"
                title="File preview"
                src="sandbox.html"
                sandbox="allow-scripts allow-forms allow-modals allow-popups"
              ></iframe>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <!-- Settings live where the library does, not on a page nobody opens. -->
    <aside class="settings-panel hidden" id="settings-panel" aria-label="Settings">
      <header class="settings-head">
        <span class="eyebrow">Settings</span>
        <button class="btn" id="settings-reset">Reset to defaults</button>
        <button class="btn btn-ghost" id="settings-close" aria-label="Close settings">&times;</button>
      </header>
      <div class="settings-body" id="settings-body"></div>
      <footer class="settings-foot mono">Settings sync with your Chrome profile.</footer>
    </aside>

    <script src="options.js"></script>
  </body>
</html>
